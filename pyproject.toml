[project]
name = "recomendador-bentoml"
version = "0.1.0"
description = "Baseline de recomendação (popularidade + mesma técnica) servido com BentoML — material de aula pt-BR"
requires-python = ">=3.13"
dependencies = [
    "bentoml>=1.4.39",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-pptx>=1.0.2",
]
